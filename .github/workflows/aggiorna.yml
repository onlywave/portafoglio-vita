name: aggiorna-dati

# Ricalcola prezzi, cambi e metriche dei portafogli VITA dai dati EOD pubblici
# e ripubblica i JSON della pagina. Le POSIZIONI (quantita' e prezzi di carico)
# vivono in portafogli/*.json e non vengono toccate: si aggiornano solo quando
# cambia la composizione sui portafogli Google Finance di riferimento.
on:
  schedule:
    - cron: "30 20 * * 1-5"   # lun-ven 20:30 UTC, dopo la chiusura delle borse europee
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Genera i dati
        run: python genera.py data
      - name: Rinfresca l'impronta degli asset nelle pagine
        run: python versiona.py
      - name: Verifica che i JSON siano validi
        run: |
          for f in data/*.json; do python -c "import json,sys; json.load(open('$f'))"; done
      - name: Pubblica
        run: |
          git config user.name "vita-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Dati al $(date -u +%F)"
          git push
